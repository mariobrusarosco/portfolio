[build]
  command = "yarn build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = ".netlify/v1/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
